  <meta name="description" content="Sean 的各平台連結">
  <style>
    :root {
      --bg: #eef5fb;
      --card: #ffffff;
      --text: #14212e;
      --muted: #667788;
      --line: #d9e6f2;
      --accent: #5a9fdc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1720;
        --card: #17222e;
        --text: #e8f0f8;
        --muted: #91a3b5;
        --line: #26364a;
        --accent: #8cc4f2;
      }
      .icon { box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      justify-content: center;
      padding: 56px 16px 40px;
    }
    main { width: 100%; max-width: 440px; }
    header { text-align: center; margin-bottom: 32px; }
    .avatar {
      width: 128px; height: 128px; margin: 0 auto 16px;
      border-radius: 50%;
      background: #eaf5fd;
      border: 3px solid var(--card);
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(80,150,210,.25);
    }
    .avatar img { width: 100%; height: 100%; object-fit: contain; padding: 10px; display: block; }
    h1 { font-size: 26px; font-weight: 700; letter-spacing: .02em; }
    .sub { color: var(--muted); margin-top: 6px; font-size: 15px; }
    ul { list-style: none; padding: 0; display: grid; gap: 10px; }
    a.link {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      color: inherit; text-decoration: none;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    a.link:hover, a.link:focus-visible {
      transform: translateY(-2px);
      border-color: var(--brand);
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
      outline: none;
    }
    .icon {
      flex: none;
      width: 40px; height: 40px; border-radius: 10px;
      display: grid; place-items: center;
      background: var(--brand); color: #fff;
    }
    .icon svg { width: 22px; height: 22px; }
    .icon img { width: 100%; height: 100%; display: block; border-radius: inherit; transform: scale(1.12); }
    .icon:has(img) { overflow: hidden; }
    .icon img.noscale { transform: none; }
    .icon-light { background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
    .label { flex: 1; min-width: 0; }
    .label strong { display: block; font-size: 16px; font-weight: 600; }
    .label span { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .arrow { color: var(--muted); font-size: 18px; }
    footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 36px; }
  </style>
</head>
